[package]
name = "naq"
description = "Core NATS server"
keywords = ["nats", "messaging", "pubsub", "server"]
categories = ["network-programming"]
# Tests stay out of the published crate.
exclude = ["tests/", "src/**/tests.rs"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true

[features]
# Entry points for the fuzz targets in `fuzz/afl`.
fuzzing = []

[dependencies]
bytes = { workspace = true, features = ["std"] }
bcrypt.workspace = true
data-encoding.workspace = true
flate2.workspace = true
getrandom.workspace = true
nkeys.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
hashbrown.workspace = true
memchr.workspace = true
naq-proto.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "macros", "signal"] }
zzq-tokio.workspace = true
omq-tokio.workspace = true
nix.workspace = true

[dev-dependencies]
rcgen.workspace = true
serde_json.workspace = true

[lints]
workspace = true
