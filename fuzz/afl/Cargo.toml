[package]
name = "naq-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license = "ISC OR Apache-2.0"
publish = false
description = "AFL fuzz targets for naq."

[dependencies]
afl = "0.18"
naq-proto = { path = "../../naq-proto" }
naq = { path = "../../naq", features = ["fuzzing"] }

[patch.crates-io]
zzq-tokio = { path = "../../../zzq.rs/zzq-tokio" }
zzq-proto = { path = "../../../zzq.rs/zzq-proto" }

[lints.rust]
missing_debug_implementations = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
