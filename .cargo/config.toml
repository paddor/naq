# Keep jumps inside 32-byte windows. On Skylake-derived CPUs with the JCC
# erratum fix, a jump that crosses or ends on a 32-byte boundary keeps its
# code out of the uop cache, and the message loops change speed with code
# placement alone. RUSTFLAGS in the environment replaces this.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "llvm-args=-x86-branches-within-32B-boundaries"]
