[workspace]
members = ["naq-proto", "naq", "naq-bench"]
default-members = ["naq-proto", "naq"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "ISC OR Apache-2.0"
authors = ["Patrik Wenger <paddor@gmail.com>"]
repository = "https://github.com/paddor/naq"
readme = "README.md"

[workspace.lints.rust]
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_const_for_fn = "warn"

[workspace.dependencies]
naq-proto = { path = "naq-proto", version = "0.1.0", default-features = false }
naq = { path = "naq", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = { version = "1.12", default-features = false }
memchr = { version = "2.7", default-features = false }
rustc-hash = "2.1"
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
tokio = { version = "1.53", default-features = false }
zzq-tokio = { version = "=0.6.0", default-features = false }
thiserror = { version = "2.0", default-features = false }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.bench]
debug = "line-tables-only"

[patch.crates-io]
zzq-tokio = { path = "../zzq.rs/zzq-tokio" }
zzq-proto = { path = "../zzq.rs/zzq-proto" }
