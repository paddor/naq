[workspace]
members = ["naq-proto", "naq", "naq-bench"]
exclude = ["fuzz"]
default-members = ["naq-proto", "naq"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "ISC OR Apache-2.0"
authors = ["Patrik Wenger <paddor@gmail.com>"]
repository = "https://github.com/paddor/naq"
readme = "README.md"

[workspace.lints.rust]
missing_debug_implementations = "deny"
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
missing_const_for_fn = "warn"

[workspace.dependencies]
naq-proto = { path = "naq-proto", version = "0.1.0", default-features = false }
naq = { path = "naq", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = { version = "1.12", default-features = false }
memchr = { version = "2.7", default-features = false }
rustc-hash = "2.1"
hashbrown = { version = "0.16", default-features = false, features = ["inline-more"] }
bcrypt = { version = "0.17", default-features = false, features = ["std"] }
data-encoding = "2.5"
getrandom = "0.2"
nkeys = { version = "0.4", default-features = false, features = ["xkeys"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.10", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
rcgen = "0.14"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
sha1_smol = "1.0"
sha2 = { version = "0.10", default-features = false }
tokio = { version = "1.53", default-features = false }
zzq-tokio = { version = "=0.6.0", default-features = false }
omq-tokio = { version = "=0.34.3", default-features = false }
nix = { version = "0.31", default-features = false, features = ["signal"] }
thiserror = { version = "2.0", default-features = false }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1

[profile.bench]
debug = "line-tables-only"

